name: Code Quality

on:
  push:
  pull_request:

jobs:
  mypy-ruff-black:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff
      
      - name: Lint
        run: ruff check .

      - name: Install Black
        run: pip install black

      - name: Format
        run: black --check .
    