name: Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
  contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.14"
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Build with Pyinstaller
              run: pyinstaller main.py --name MessedUpFarm --onefile --add-data "client/src/assets;client/src/assets" --windowed
            
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with: 
                tag_name: v0.0.${{ github.run_id }}.${{ github.run_attempt }}
                name: Build v0.0.${{ github.run_id }}.${{ github.run_attempt }}
                files: dist/MessedUpFarm.exe
            

