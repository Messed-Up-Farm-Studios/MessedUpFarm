name: Tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    pytest:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set Up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
            
            - name: Install pytest
              run: |
                    python -m pip install --upgrade pip
                    pip install pytest
                    pip install -r requirements.txt
            
            - name: Run Tests
              run: pytest .