[project]
name = "messedupfarm"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server", "src/model"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "PT", "RUF", "C4"]
ignore = ["E501"] # Line too long

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # Allow assert in tests

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["server", "model"]

[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(venv|\.venv|\.git|__pycache__|build|dist)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
