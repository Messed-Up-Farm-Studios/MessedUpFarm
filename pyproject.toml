[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E = PEP8/style issues
# F = pyflakes bugs (unused/undefined code)
# I = import sorting
# B = bug-risk patterns
# UP = modern Python syntax upgrades
# SIM = simplification/refactoring suggestions
# TODO add S and ~W to our pyproject.toml

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["server", "shared", "client"]
