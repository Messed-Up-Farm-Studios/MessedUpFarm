[project]
name = "messedupfarm"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "arcade==3.3.3",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "uvicorn>=0.52.0",
    "websockets>=17.0.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "PT", "RUF", "C4"]
ignore = ["E501"] # Line too long

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"] # Allow assert in tests

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["server", "shared", "client"]

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(venv|\.venv|\.git|__pycache__|build|dist)/
'''

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]


[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
