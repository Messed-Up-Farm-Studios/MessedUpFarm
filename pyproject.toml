[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E = PEP8/style issues
# F = pyflakes bugs (unused/undefined code)
# I = import sorting
# B = bug-risk patterns
# UP = modern Python syntax upgrades
# SIM = simplification/refactoring suggestions
ignore = ["E501"] # Line too long


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["server", "shared", "client"]

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(venv|\.venv|\.git|__pycache__|build|dist)/
'''